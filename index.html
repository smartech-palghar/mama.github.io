<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <link
      rel="shortcut icon"
      type="x-icon"
      href="./Photo/logo/mamacha gav logo.png"
    />
    <!-- Bootstrap CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css"
      integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="style.css" />

    <title>Mamacha Gaon Resort</title>
  </head>
  <body>

<div id="content">

</div>

<script>
  fetch('https://mamachagaon.netlify.app/content.html')
  .then(response => response.text())
  .then(html => {
    const container = document.createElement('div');
    container.innerHTML = html;

    const contentFromContentHtml = container.querySelector('#content').innerHTML

    document.getElementById('content').innerHTML = contentFromContentHtml;

  })
  .catch(error => console.error('Contact Your Developer :', error))
</script>


  </body>
</html>
